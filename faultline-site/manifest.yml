# Faultline Companion (site app) — schema-verified against CLI 15.x conventions.

app:
  id: ari:cloud:ecosystem::app/d2b59f0b-4c0d-4565-8826-7f4d0adbc868
  runtime:
    name: nodejs22.x

modules:
  webtrigger:
    - key: postmortem-search-trigger
      function: postmortem-search
      # The main (Bitbucket) app calls this with the shared bearer token.

  function:
    - key: postmortem-search
      handler: resolvers/index.runPostmortemSearch

resources: []

permissions:
  scopes:
    - search:confluence # site-classified — legal here because this app has NO Bitbucket scopes
