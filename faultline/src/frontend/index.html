<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Faultline — activity</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; margin: 24px; color: #172B4D; }
      h2 { margin-bottom: 4px; }
      .sub { color: #5E6C84; margin-bottom: 20px; }
      .pr { border: 1px solid #DFE1E6; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
      .pr h3 { margin: 0 0 8px; font-size: 15px; }
      .pr small { color: #5E6C84; }
      button { background: #0052CC; color: #fff; border: 0; border-radius: 3px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
      button:hover { background: #0747A6; }
      .file { font-size: 13px; margin: 6px 0 0 0; color: #344563; }
      .file code { background: #F4F5F7; padding: 1px 4px; border-radius: 3px; }
      .ev { color: #6554C0; }
      .empty { color: #5E6C84; }
    </style>

    <div id="root"></div>
