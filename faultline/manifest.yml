# Faultline — Codegeist 2026
# Schema-verified against the CLI's own manifest-schema.json (CLI 15.x):
# - runtime lives inside app:
# - rovo:agent requires key/name/prompt (inline string), no title
# - actions are defined as `action` modules (required: function, description,
#   actionType, key) and referenced by key from rovo:agent and rovo:mcp
# - rovo:mcp is the native MCP server module — the bonus-track path
# - jira:globalPage uses a Custom UI resource (directory with index.html)

app:
  id: ari:cloud:ecosystem::app/ef448580-8359-4dae-8b3c-50d3202b6472
  runtime:
    name: nodejs22.x
  # Required for KVS access: declares what kind of data the app stores.
  # Faultline stores derived app data (risk rankings, PR titles, digests) — "other".
  storage:
    classifications:
      - other

modules:
  # --- The assignable Rovo chat agent -------------------------------------
  rovo:agent:
    - key: faultline-agent
      name: Faultline
      icon: "🔍"
      description: >-
        PR review copilot: ranks where a reviewer's attention matters on every
        pull request, backed by your own postmortems and dependency graph, with
        cited evidence. The LLM never reviews code — the guide is deterministic.
      prompt: |-
        You are Faultline, a pull-request review copilot living inside this Atlassian site.
        Your job: defend the reviewer's attention. You build context, rank where to look,
        and answer questions about pull requests — with evidence, never vibes.

        Non-negotiable rules:
        1. Only state facts that come from your tools (list-open-prs, get-review-context,
           get-file-risk, analyze-pr). Never invent file names, scores, histories, or PR numbers.
        2. Every factual claim carries its evidence: the file path, the risk score, and the
           stated reason from the stored analysis. Quote it, don't paraphrase it loosely.
        3. If you don't know, say so — and you can fix it: call analyze-pr (arguments: ws,
           repo, prId) to run a fresh analysis on demand.
        4. You never tell a reviewer to skip a file. Rankings are a starting point, not a
           verdict. If asked "can I skip X?", say every changed file deserves eyes, and the
           ranking only tells them where to start.
        5. Be concise. Prefer a short answer with one citation over a paragraph.

        Tone: friendly, precise, slightly allergic to hype. A senior engineer's helpful
        colleague — not a cheerleader. No emoji spam (the guide has its own icons).

        Example exchanges:
        - "why is retry.js risky?" → "🔴 src/payments/retry.js — risk 78/100 (CRITICAL).
          Reasons: payment-critical path · no test changes included in this PR · changed 11×
          in recent history. That's from the stored analysis for this PR — the full table is
          in the review guide comment."
        - "should I skip the CSS file?" → "I can't recommend skipping any file — rankings
          are a starting point, not a verdict. That said, styles/theme.css scored 12/100
          (LOW): styling/static assets, small change."
        - "what changed in PR 51?" → "I don't have a stored analysis for PR #51. Want me to
          run one now? I just need the workspace and repo."
      conversationStarters:
        - Which of my open PRs needs my attention first?
        - Why is retry.js risky?
        - Analyze PR #1 in my repo
      actions:
        - list-open-prs
        - get-review-context
        - get-file-risk
        - analyze-pr

  # --- Agent + MCP tools (schema: function, description, actionType, key) --
  action:
    - key: list-open-prs
      actionType: faultline:pr:list
      function: agent-tools
      name: List open PRs
      description: >-
        Lists open pull requests on repos Faultline has analyzed. Returns
        workspace, repo, prId, title, analyzed, topRisk — use those exact
        values as arguments for the other actions.
    - key: get-review-context
      actionType: faultline:pr:context
      function: agent-tools
      name: Get review context
      description: >-
        Get the stored risk ranking and evidence digest for one pull request.
        Arguments: ws (Bitbucket workspace), repo (repository slug), prId
        (number).
    - key: get-file-risk
      actionType: faultline:file:risk
      function: agent-tools
      name: Get file risk
      description: >-
        Get the risk score, tier and reasons for one file in a pull request.
        Arguments: ws, repo, prId, path (file path; partial paths tolerated).
    - key: analyze-pr
      actionType: faultline:pr:analyze
      function: agent-tools
      name: Analyze a pull request
      description: >-
        Run a fresh risk analysis for a pull request now: fetches the PR, ranks
        its changed files, posts or updates the guide comment, and returns the
        ranked result. Arguments: ws, repo, prId.

  # --- Native MCP server (Best App with Atlassian MCP bonus track) ---------
  rovo:mcp:
    - key: faultline-mcp
      name: Faultline
      tools:
        - list-open-prs
        - get-review-context
        - get-file-risk
        - analyze-pr

  # --- Bitbucket PR webhook --------------------------------------------------
  webtrigger:
    - key: pr-webhook-trigger
      function: pr-webhook
      # Wire the printed URL into a Bitbucket webhook created VIA THE API
      # (POST /2.0/repositories/{ws}/{repo}/hooks) — the repo-settings UI cannot
      # send the Authorization header. Triggers: Pull request: Created + Commits updated.

  # --- Transparent admin/activity page (Custom UI) ---------------------------
  jira:globalPage:
    - key: faultline-admin
      resource: main
      title: Faultline

  function:
    - key: pr-webhook
      handler: resolvers/index.runPrWebhook
    - key: agent-tools
      handler: resolvers/index.runAgentAction
    - key: recent-analyses
      handler: resolvers/index.runRecentAnalyses

resources:
  - key: main
    path: src/frontend

permissions:
  external:
    fetch:
      backend:
        - "https://*.atlassian-dev.net/*"   # companion site app webtrigger (evidence bridge)
        - "https://*.atlassian.net/*"       # Atlassian-hosted endpoints
  scopes:
    - read:pullrequest:bitbucket
    - write:pullrequest:bitbucket
    - read:repository:bitbucket
    - storage:app
    # ARCHITECTURE CONSTRAINT (deploy-validated): ALL Bitbucket scopes are
    # workspace-classified and cannot be mixed with site scopes (search:confluence)
    # in one app. Chosen: the Bitbucket core loop (webhook → analysis → guide
    # comment). Consequence: the Confluence postmortem layer degrades honestly
    # to "evidence unavailable (search responded 403)" — it renders in the guide
    # as a fetch failure, never as "no incident history".
  # Teamwork Graph (blast radius, TWG bonus track): add the granular scope(s)
  # matching your registered traversal when you set TWG_BLAST_RADIUS_QUERY_KEY.
